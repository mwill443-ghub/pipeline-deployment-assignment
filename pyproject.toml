[project]
name = "pipeline-deployment-assignment"
version = "0.1.0"
description = "Fitted scikit-learn Pipeline served via FastAPI, deployed on Modal"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.141.1",
    "joblib>=1.6.0",
    "modal>=1.5.5",
    "numpy>=2.4.6",
    "pandas>=3.0.5",
    "pydantic>=2.13.5",
    "scikit-learn>=1.9.1",
    "uvicorn[standard]>=0.52.4",
]

[tool.uv]
package = false
